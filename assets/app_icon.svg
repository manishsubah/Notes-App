<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t d">
  <title id="t">NotesApp icon</title>
  <desc id="d">A white boarding-pass note with one amber lit row and an amber stub carrying a plus, on a navy gate-board ground.</desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15263D"/>
      <stop offset="1" stop-color="#0A1422"/>
    </linearGradient>
    <clipPath id="stub">
      <rect x="224" y="326" width="576" height="372" rx="44"/>
    </clipPath>
  </defs>

  <!-- Ground: navy ink with faint board rules -->
  <rect width="1024" height="1024" fill="url(#ground)"/>
  <g stroke="#9FB0C6" stroke-opacity="0.10" stroke-width="4">
    <path d="M0 150H1024M0 250H1024M0 774H1024M0 874H1024"/>
  </g>

  <g transform="translate(512 512) scale(1.12) translate(-512 -512)">
  <!-- Soft drop shadow -->
  <rect x="224" y="346" width="576" height="372" rx="44" fill="#000" opacity="0.28"/>

  <!-- Pass body (white) -->
  <rect x="224" y="326" width="576" height="372" rx="44" fill="#FFFFFF"/>

  <!-- Lit row: the note that just landed -->
  <g clip-path="url(#stub)">
    <rect x="224" y="470" width="400" height="84" fill="#FFF4CC"/>
    <rect x="224" y="470" width="14" height="84" fill="#F2B705"/>
  </g>

  <!-- Board rows: time block + note line -->
  <g>
    <rect x="266" y="383" width="64" height="26" rx="6" fill="#9FB0C6"/>
    <rect x="352" y="383" width="228" height="26" rx="13" fill="#C3CCD7"/>

    <rect x="266" y="499" width="64" height="26" rx="6" fill="#F2B705"/>
    <rect x="352" y="499" width="204" height="26" rx="13" fill="#0E1A2B"/>

    <rect x="266" y="615" width="64" height="26" rx="6" fill="#9FB0C6"/>
    <rect x="352" y="615" width="160" height="26" rx="13" fill="#C3CCD7"/>
  </g>

  <!-- Amber stub -->
  <g clip-path="url(#stub)">
    <rect x="624" y="326" width="176" height="372" fill="#F2B705"/>
  </g>

  <!-- Perforation -->
  <path d="M624 372V652" stroke="#0E1A2B" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 20"/>

  <!-- Notches cut into the pass -->
  <circle cx="624" cy="326" r="30" fill="#12223A"/>
  <circle cx="624" cy="698" r="30" fill="#0B1626"/>

  <!-- Add mark on the stub -->
  <g fill="#0E1A2B">
    <rect x="668" y="500" width="88" height="24" rx="12"/>
    <rect x="700" y="468" width="24" height="88" rx="12"/>
  </g>
  </g>
</svg>
